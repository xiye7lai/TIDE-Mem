[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tide-mem"
version = "0.1.0"
description = "Temporal, identity-isolated, dual-view evidence memory for Agent Memory Challenge 2026"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "TIDE-Mem contributors"}]
dependencies = [
  "fastapi==0.128.2",
  "httpx==0.28.1",
  "pydantic==2.13.4",
  "uvicorn[standard]==0.48.0",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2"]

[tool.setuptools.packages.find]
include = ["tide_mem*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

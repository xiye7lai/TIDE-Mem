services:
  - type: web
    name: tide-mem-amc2026-xiye7lai
    runtime: docker
    plan: starter
    region: frankfurt
    numInstances: 1
    autoDeployTrigger: off
    healthCheckPath: /health
    maxShutdownDelaySeconds: 60
    dockerfilePath: ./Dockerfile
    dockerContext: .
    disk:
      name: tide-memory-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: TIDE_MEMORY_API_KEY
        generateValue: true
      - key: TIDE_LLM_API_KEY
        sync: false
      - key: TIDE_LLM_API_BASE
        value: https://api.openai.com/v1
      - key: TIDE_LLM_MODEL
        value: gpt-4o-mini
      - key: TIDE_ENFORCE_GPT4O_MINI
        value: "true"
      - key: TIDE_LLM_MODE
        value: api
      - key: TIDE_LLM_REQUIRED
        value: "true"
      - key: TIDE_DB_PATH
        value: /data/tide_mem.sqlite3
      - key: TIDE_TTL_DAYS
        value: "30"
      - key: TIDE_TTL_CLEANUP_INTERVAL_SECONDS
        value: "21600"
      - key: TIDE_LLM_MAX_CONCURRENCY
        value: "16"
      - key: TIDE_LLM_TIMEOUT_SECONDS
        value: "120"
      - key: TIDE_LLM_MAX_RETRIES
        value: "5"
      - key: TIDE_MAX_CARDS_PER_ADD
        value: "24"
      - key: TIDE_MAX_SUMMARY_CARDS_PER_ADD
        value: "4"
      - key: TIDE_RETRIEVAL_CANDIDATE_LIMIT
        value: "220"
      - key: TIDE_RERANK_CANDIDATE_LIMIT
        value: "80"
      - key: TIDE_RETURNED_CONTENT_MAX_CHARS
        value: "1800"
      - key: TIDE_REQUIRE_AUTH
        value: "true"
      - key: TIDE_LOG_LEVEL
        value: INFO

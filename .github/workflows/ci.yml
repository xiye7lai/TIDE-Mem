name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
        env:
          PYTHONPATH: .
      - run: python -m compileall -q tide_mem scripts
      - name: Validate POSIX entrypoint syntax
        run: bash -n deploy/docker-entrypoint.sh

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build --tag tide-mem:ci .
